services:
  app:
    build: .
    ports:
      - ${APP_PORT}:${APP_PORT}
    env_file: .env
    environment:
      - PYTHONPATH=/app/src
      - VECTOR_DB_HOST=db_vector
      - VECTOR_DB_PORT=8000
      - VECTOR_HOST=db_vector
      - VECTOR_PORT=8000
    depends_on:
      - db_sql
      - db_nosql
      - db_vector
    volumes:
      - ./data:/app/data
      - ./src:/app/src

  db_sql:
    image: postgres:16
    environment:
      POSTGRES_USER: ${SQL_USER}
      POSTGRES_PASSWORD: ${SQL_PASSWORD}
      POSTGRES_DB: ${SQL_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "${SQL_PORT}:5432"

  api:
    build: 
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8500:8500"
    env_file: .env
    environment:
      - PYTHONPATH=/app:/app/src
      - VECTOR_DB_HOST=db_vector
      - VECTOR_DB_PORT=8000
      - VECTOR_HOST=db_vector
      - VECTOR_PORT=8000
    volumes:
      - ./apps/api:/app/api
      - ./src/agents:/app/src/agents
      - ./src/chat_saude:/app/src/chat_saude
    depends_on:
      - db_sql
      - db_nosql
      - db_vector

  db_nosql:
    image: mongo:latest
    ports:
      - "${MONGO_PORT}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    volumes:
      - mongo_data:/data/db

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  db_vector:
    image: chromadb/chroma:latest
    environment:
      - CHROMA_DB_PATH=${VECTOR_DB_PATH}
    volumes:
      - chroma_data:/chroma/chroma
    ports:
      - "${VECTOR_PORT}:8000"

volumes:
  postgres_data:
  mongo_data:
  chroma_data:
  ollama_data: